; =============================================================================
; GreenThumbs Plantekrukke — PlatformIO config
; =============================================================================
; ESP32-C6 + ESP-IDF + ESP-Matter SDK
;
; PREREQUISITES:
;   1. PlatformIO Core eller IDE installeret
;   2. ESP-IDF 5.2+ (auto-installeres af platform-versionen nedenfor)
;   3. ESP-Matter SDK klonet til components/ — se README i denne mappe
;
; AUDIT-FIX 2026-06:
;   - platform hævet fra ^6.5.0 (IDF 5.1) til ^6.9.0 (IDF 5.3+):
;     driver/i2c_master.h (ny I2C master API, brugt i temp_humidity.cpp)
;     kræver IDF >= 5.2. VERIFICÉR ved første `pio run` at den valgte
;     platform-version reelt leverer IDF >= 5.2 og har ESP32-C6 support —
;     ellers brug pioarduino-forken:
;     platform = https://github.com/pioarduino/platform-espressif32.git
;   - redundante -DCONFIG_* build_flags fjernet (sdkconfig.defaults er
;     den eneste source of truth for IDF-config)
;
; NOTE: XIAO ESP32-C6 board file er muligvis ikke i mainstream platformio;
;       brug esp32-c6-devkitc-1 som base — pin-mapping styres i main.cpp.
; =============================================================================

[env:greenthumbs_pot]
platform = espressif32 @ ^6.9.0
board = esp32-c6-devkitc-1
framework = espidf
; USB-CDC console (CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG) ignorerer baudrate,
; men pio device monitor kræver en værdi
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DGREENTHUMBS_VERSION=\"0.1.0-dev\"
    -DGREENTHUMBS_DEVICE_TYPE=\"plantekrukke\"

; ESP-Matter SDK integreres som ESP-IDF component — IKKE som lib_deps.
; Klon manuelt (se README):
;   mkdir -p components && cd components
;   git clone --recursive --depth 1 --branch v1.3 \
;     https://github.com/espressif/esp-matter.git
; Hvis PIO+esp-matter integration fejler i Fase 1: fallback er idf.py
; direkte til target-builds (PIO beholdes til native unit tests).
lib_deps =

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Partition table — 4MB layout: factory + 1 OTA (se partitions.csv aritmetik)
board_build.partitions = partitions.csv

monitor_filters =
    esp32_exception_decoder
    colorize


; -----------------------------------------------------------------------------
; Native unit tests (kør på dev-maskine, ikke ESP32)
; -----------------------------------------------------------------------------
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -DGREENTHUMBS_VERSION=\"0.1.0-dev-native\"
test_filter = native/*
; Byg src/ med i test-binary (main.cpp er guarded med #ifndef NATIVE_TEST)
test_build_src = yes
build_src_filter = +<*> -<main.cpp>

