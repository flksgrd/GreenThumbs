; =============================================================================
; GreenThumbs Plantekrukke — PlatformIO config
; =============================================================================
; ESP32-H2 (Waveshare ESP32-H2-Zero; senere ESP32-H2-MINI-1-H4S på eget PCB)
; + ESP-IDF + ESP-Matter SDK — se ADR 014
;
; PREREQUISITES:
;   1. PlatformIO Core eller IDE installeret
;   2. ESP-IDF 5.2+ (auto-installeres af platform-versionen nedenfor)
;   3. ESP-Matter SDK klonet til components/ — se README i denne mappe
;
; AUDIT-FIX 2026-06:
;   - platform hævet fra ^6.5.0 (IDF 5.1) til ^6.9.0 (IDF 5.3+):
;     driver/i2c_master.h (ny I2C master API, brugt i temp_humidity.cpp)
;     kræver IDF >= 5.2.
;   - 2026-10-26: skiftet til pioarduino-forken — den officielle platform
;     (6.13) understøtter ikke ESP32-H2 (hårdkodede RISC-V-lister i
;     builderen). Kræver PlatformIO på Python ≤ 3.13.
;   - redundante -DCONFIG_* build_flags fjernet (sdkconfig.defaults er
;     den eneste source of truth for IDF-config)
;
; Board: esp32-h2-devkitm-1 som base (samme chip som ESP32-H2-Zero, 4MB);
;        pin-mapping styres i main.cpp.
; =============================================================================

[env:greenthumbs_pot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-h2-devkitm-1
; ESP32-H2FH4S / MINI-1-H4S: 4MB (H2-varianten har kun 2MB — for lidt til OTA)
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = espidf
; USB-CDC console (CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG) ignorerer baudrate,
; men pio device monitor kræver en værdi
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DGREENTHUMBS_VERSION=\"0.1.0-dev\"
    -DGREENTHUMBS_DEVICE_TYPE=\"plantekrukke\"

; Workaround: OpenThread-define med mellemrum citeres forkert af PIO (se scriptet)
extra_scripts = pre:scripts/fix_ot_datetime.py

; ESP-Matter SDK integreres som ESP-IDF component — IKKE som lib_deps.
; Klon manuelt (se README):
;   mkdir -p components && cd components
;   git clone --recursive --depth 1 --branch <release der matcher IDF 5.5.5> \
;     https://github.com/espressif/esp-matter.git
; Hvis PIO+esp-matter integration fejler i Fase 1: fallback er idf.py
; direkte til target-builds (PIO beholdes til native unit tests).
lib_deps =

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Partition table — 4MB layout: factory + 1 OTA (se partitions.csv aritmetik)
board_build.partitions = partitions.csv

monitor_filters =
    esp32_exception_decoder
    colorize


; -----------------------------------------------------------------------------
; Native unit tests (kør på dev-maskine, ikke ESP32)
; -----------------------------------------------------------------------------
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -DGREENTHUMBS_VERSION=\"0.1.0-dev-native\"
test_filter = native/*
; Byg src/ med i test-binary (main.cpp er guarded med #ifndef NATIVE_TEST)
test_build_src = yes
build_src_filter = +<*> -<main.cpp>

