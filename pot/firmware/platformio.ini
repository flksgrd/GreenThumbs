; =============================================================================
; GreenThumbs Plantekrukke — PlatformIO config
; =============================================================================
; ESP32-C6 + ESP-IDF + ESP-Matter SDK
;
; PREREQUISITES:
;   1. PlatformIO Core eller IDE installeret
;   2. ESP-IDF 5.1+ (auto-installeres af platform = espressif32)
;   3. ESP-Matter SDK kloned separat — se README i denne mappe
;
; NOTE: XIAO ESP32-C6 board file er muligvis ikke i mainstream platformio endnu;
;       brug esp32-c6-devkitc-1 som base og override pin-mapping i firmware.
; =============================================================================

[env:greenthumbs_pot]
platform = espressif32 @ ^6.5.0
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800

; Build flags
build_flags =
    -DCONFIG_OPENTHREAD_ENABLED=1
    -DCONFIG_USE_MINIMAL_MDNS=0
    -DCONFIG_ENABLE_CHIPOBLE=1
    -DGREENTHUMBS_VERSION=\"0.1.0-dev\"
    -DGREENTHUMBS_DEVICE_TYPE=\"plantekrukke\"

; ESP-Matter SDK kommer ind som ESP-IDF component
; Se: https://github.com/espressif/esp-matter
; Anbefales at klone esp-matter ind under "components/" mappen og pinne til en specifik tag.
;
; lib_deps:
;     ; Sensor-libraries der er git-baseret (ingen native PIO library)
;     ; HX711: https://github.com/bogde/HX711 (eller skriv egen bit-banged driver)
lib_deps =

; ESP-IDF settings
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Partition table — Matter SDK kræver mindst 2MB app + factory + storage
board_build.partitions = partitions.csv

; Monitor filters
monitor_filters =
    esp32_exception_decoder
    colorize


; -----------------------------------------------------------------------------
; Native unit tests (kør på dev-maskine, ikke ESP32)
; -----------------------------------------------------------------------------
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE_TEST
test_filter = native/*
